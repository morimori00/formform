<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>新規お取引先登録 | 北斗エレクトロン 調達ポータル</title>
<style>
  body{font-family:"Hiragino Sans",sans-serif;margin:0;background:#f4f4f6;color:#222}
  header{background:#123c3a;color:#fff;padding:20px 32px}
  form{max-width:720px;margin:24px auto;background:#fff;padding:24px 32px;border-radius:8px}
  fieldset{border:0;border-top:1px solid #ddd;margin:16px 0 0;padding:12px 0 0}
  legend{font-weight:700;padding-right:8px}
  label{display:grid;grid-template-columns:220px 1fr;gap:8px;align-items:center;margin:8px 0}
  input,select{padding:6px 8px;border:1px solid #bbb;border-radius:4px}
  .req{color:#d33;font-size:12px}
  button{margin-top:16px;padding:10px 28px;background:#123c3a;color:#fff;border:0;border-radius:4px;font-size:16px}
</style>
</head>
<body>
<header><h1>北斗エレクトロン 調達ポータル</h1><p>新規お取引先登録フォーム</p></header>
<form id="vendor">
  <p>貴社の情報をご入力ください。<span class="req">※</span> は必須項目です。</p>
  <fieldset><legend>会社情報</legend>
    <label><span>商号 <span class="req">※</span></span><input name="company" required></label>
    <label><span>法人番号（13桁）<span class="req">※</span></span><input name="corporate_number" required inputmode="numeric"></label>
    <label><span>郵便番号（ハイフンなし）</span><input name="zip" inputmode="numeric"></label>
    <label><span>本社所在地 <span class="req">※</span></span><input name="address" required></label>
    <label><span>代表者氏名 <span class="req">※</span></span><input name="representative" required></label>
    <label><span>設立年月日</span><input name="founded" type="date"></label>
    <label><span>資本金（万円）</span><input name="capital" inputmode="numeric"></label>
    <label><span>従業員数</span><input name="employees" inputmode="numeric"></label>
  </fieldset>
  <fieldset><legend>お支払い先口座</legend>
    <label><span>銀行名 <span class="req">※</span></span><input name="bank" required></label>
    <label><span>支店名 <span class="req">※</span></span><input name="branch" required></label>
    <label><span>口座種別 <span class="req">※</span></span><select name="account_type" required>
      <option value="">選択してください</option><option value="futsu">普通</option><option value="toza">当座</option><option value="chochiku">貯蓄</option></select></label>
    <label><span>口座番号 <span class="req">※</span></span><input name="account_number" required inputmode="numeric"></label>
    <label><span>口座名義（カナ）</span><input name="account_kana"></label>
    <label><span>適格請求書発行事業者登録番号</span><input name="invoice_number"></label>
  </fieldset>
  <fieldset><legend>情報セキュリティ</legend>
    <label><span>ISMS 認証登録番号</span><input name="isms"></label>
    <label><span>セキュリティ窓口メールアドレス</span><input name="security_email" type="email"></label>
    <label><span>ご担当者の携帯電話番号 <span class="req">※</span></span><input name="mobile" type="tel" required></label>
  </fieldset>
  <button type="submit">登録内容を送信</button>
</form>
<script>
  // Tests read the values through this hook; nothing is sent anywhere.
  const values = () => Object.fromEntries(new FormData(document.getElementById("vendor")));
  window.__values = values;
  document.getElementById("vendor").addEventListener("submit", e => { e.preventDefault(); window.__submitted = values(); });
</script>
</body>
</html>
